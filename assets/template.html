<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行路书</title>
<style>
:root{--ink:#123d48;--paper:#edf5f4;--accent:#176b74;--line:#c7dcdd;--body:16px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:var(--body)/1.75 'Segoe UI','Microsoft YaHei',sans-serif}body.b{--paper:#f4f6fb;--ink:#252f48;--accent:#4a5792;--line:#d5dbee}body.large{--body:18px}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}a{color:var(--accent)}:focus-visible{outline:3px solid #ce7a44;outline-offset:4px}.wrap{max-width:1100px;margin:auto;padding:0 32px}header{display:flex;justify-content:space-between;align-items:center;padding:23px 0;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.08em}.mark{font-size:17px;font-weight:700}.hero{position:relative;overflow:hidden;padding:70px 0 60px;min-height:340px}.eyebrow{font-size:13px;letter-spacing:.15em;color:var(--accent)}h1{font:clamp(42px,7vw,78px)/1.12 Georgia,'Microsoft YaHei',serif;letter-spacing:-.045em;margin:20px 0}h1 span{display:block;font-size:.46em;letter-spacing:.02em;margin-top:18px}p{margin:8px 0}.hero p{max-width:560px;position:relative;z-index:1}.motif{position:absolute;width:380px;height:220px;right:-70px;bottom:0;border:1px solid var(--line);border-radius:50%;transform:rotate(-20deg);pointer-events:none}.motif:before,.motif:after{content:'';position:absolute;inset:25px;border:1px solid var(--line);border-radius:50%}.motif:after{inset:50px}.b .hero{min-height:0;padding:35px 0}.b h1{font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-size:48px}.b .motif{display:none}.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.pill{font-size:12px;border:1px solid var(--line);padding:4px 12px;border-radius:30px}.note{padding:12px 16px;border-left:3px solid #ce7a44;background:#fff6e9;font-size:14px;margin:12px 0 24px;color:#704c2f}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:26px 0 16px}h2{font-size:23px;line-height:1.4;margin:0}small{font-size:12px;color:var(--accent)}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:25px}.tab{text-align:left;background:transparent;border:1px solid var(--line);padding:12px;border-radius:10px;color:inherit;min-width:0}.tab span{display:block;font-size:12px;margin-top:4px}.tab[aria-selected=true]{background:var(--ink);color:white;border-color:var(--ink)}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:26px}.panel{background:#ffffffb8;padding:26px;border:1px solid var(--line);border-radius:14px}.b .panel,.b .tab{border-radius:4px}.day-title{display:flex;justify-content:space-between;gap:15px}.summary{margin:16px 0 20px}.event{padding:14px 0;border-top:1px solid var(--line)}.event-title{display:flex;justify-content:space-between;gap:16px;font-weight:600}.status{font-size:12px;font-weight:400;color:var(--accent);white-space:nowrap}details summary{cursor:pointer;font-size:14px}details p{font-size:.9em;opacity:.85}.stay{padding:16px 0;border-top:1px solid var(--line)}.stay strong{display:block}.stay p{font-size:.9em}.pending{margin:26px 0;padding:24px;border:1px solid var(--line);border-radius:14px}.pending ul{padding-left:20px;margin-bottom:0}.pending li{padding:4px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0}.actions button{padding:10px 18px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px}.version{font-size:12px;padding:20px 0 40px;border-top:1px solid var(--line)}[hidden]{display:none!important}@media(max-width:650px){.wrap{padding:0 18px}header{gap:16px;letter-spacing:0}.hero{padding:38px 0 32px;min-height:0}h1{font-size:46px}.b h1{font-size:36px}.motif{opacity:.6;width:220px;right:-130px}.tabs{display:flex;overflow:auto;padding-bottom:8px;scroll-snap-type:x mandatory}.tab{flex:0 0 91px;scroll-snap-align:start}.layout{grid-template-columns:1fr;gap:16px}.panel{padding:20px}.section-head{align-items:start}h2{font-size:21px}.event-title{gap:8px}.large h1{font-size:49px}}@media(prefers-reduced-motion:no-preference){.tab{transition:background .2s,color .2s}}
</style>
<body><div class="wrap"><header><div class="mark">行旅 / ROADBOOK</div><div id="direction"></div></header><main><section class="hero"><div class="eyebrow">SHANGHAI → BANGKOK → PATTAYA</div><h1 id="title"></h1><p id="subtitle"></p><div class="meta" id="meta"></div><div class="motif" aria-hidden="true"></div></section><div class="note">测试路书 · 酒店名称与地址均为虚构。日期、航班及活动尚未确认，不作为实际出行依据。</div><div class="section-head"><h2>七天，慢慢展开</h2><small>点选日期，查看安排</small></div><div class="tabs" role="tablist" aria-label="旅行日期" id="tabs"></div><div class="layout"><section class="panel" id="day" role="tabpanel"></section><aside class="panel"><h2>这一晚住哪里</h2><div id="stays"></div></aside></div><section class="pending"><h2>出发前，补上这些</h2><ul id="pending"></ul></section><div class="actions"><button id="download">保存离线路书</button><button id="data">保存行程数据</button></div><p><small>页面内容可离线查看；外部地图与导航需联网。尚未确认的安排会保留在清单中。</small></p></main><footer class="version" id="version"></footer></div>
<script type="application/json" id="trip">__DATA__</script><script>
const trip=JSON.parse(document.getElementById('trip').textContent);const el=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=0;document.body.className=(trip.theme.direction==='b'?'b':'a')+(trip.theme.large?' large':'');document.title=trip.title+' · 旅行路书';el('title').textContent=trip.title;const line=document.createElement('span');line.textContent='城市与海岸之间';el('title').append(line);el('subtitle').textContent=trip.subtitle;el('direction').textContent=trip.theme.direction==='b'?'B / 随身查阅':'A / 城市与海岸';el('meta').innerHTML=[trip.duration+' 天',trip.origin+'出发',trip.dates||'日期待定','航班待补充'].map(x=>'<span class="pill">'+escape(x)+'</span>').join('');
el('tabs').innerHTML=trip.days.map((d,i)=>'<button class="tab" role="tab" id="tab-'+i+'" aria-controls="day" aria-selected="'+(i===0)+'" data-i="'+i+'">第 '+d.number+' 天<span>'+escape(d.city)+'</span></button>').join('');
function render(i){active=i;document.querySelectorAll('.tab').forEach((b,n)=>{b.setAttribute('aria-selected',String(n===i));b.tabIndex=n===i?0:-1});const d=trip.days[i];el('day').setAttribute('aria-labelledby','tab-'+i);el('day').innerHTML='<div class="day-title"><h2>第 '+d.number+' 天 · '+escape(d.city)+'</h2><small>'+escape(d.status)+'</small></div><p class="summary">'+escape(d.summary)+'</p>'+d.events.map(e=>'<div class="event"><div class="event-title">'+escape(e.title)+'<span class="status">'+escape(e.status)+'</span></div><details><summary>查看说明</summary><p>'+escape(e.detail)+'</p></details></div>').join('');const stays=trip.bookings.filter(b=>b.nights.includes(d.number));el('stays').innerHTML=stays.length?stays.map(b=>'<div class="stay"><small>'+escape(b.status)+(b.synthetic?' · 虚构测试':'')+'</small><strong>'+escape(b.name)+'</strong><p>'+escape(b.address)+'</p><p>'+escape(b.city)+' · 第 '+b.nights.join('、')+' 晚</p></div>').join(''):'<div class="stay"><strong>住宿尚未确定</strong><p>选好酒店后补充名称、地址和入住晚数即可。</p></div>';}
el('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)render(Number(b.dataset.i))});el('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?trip.days.length-1:(active+(e.key==='ArrowRight'?1:-1)+trip.days.length)%trip.days.length;render(n);document.getElementById('tab-'+n).focus()});el('pending').innerHTML=[...trip.conflicts,...trip.pending].map(x=>'<li>'+escape(x)+'</li>').join('');el('version').textContent='行程 '+trip.contentVersion+' / 样式 '+trip.styleVersion+' · '+trip.timezone+' · 设计主题为示例推断';function save(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}el('download').onclick=()=>save('<!doctype html>\n'+document.documentElement.outerHTML,'旅行路书.html','text/html;charset=utf-8');el('data').onclick=()=>save(JSON.stringify(trip,null,2),'trip.json','application/json');render(0);
</script></body></html>
